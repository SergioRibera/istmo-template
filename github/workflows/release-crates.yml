name: release-crates

on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --token ${{"{{"}} secrets.CARGO_REGISTRY_TOKEN {{"}}"}}
