name: release-play

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  play:
    name: Play Store internal track
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264'
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: '8.7' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-linux-android,x86_64-linux-android' }
      - uses: Swatinem/rust-cache@v2

      - name: decode release keystore
        run: |
          echo "${{"{{"}} secrets.ANDROID_KEYSTORE_B64 {{"}}"}}" | base64 -d > "$HOME/release.jks"
          echo "ANDROID_RELEASE_KEYSTORE=$HOME/release.jks" >> "$GITHUB_ENV"

      - name: assemble release bundle (.aab)
        working-directory: android
        run: gradle bundleRelease
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{"{{"}} secrets.ANDROID_STORE_PASSWORD {{"}}"}}
          ANDROID_RELEASE_KEY_ALIAS:      ${{"{{"}} secrets.ANDROID_KEY_ALIAS {{"}}"}}
          ANDROID_RELEASE_KEY_PASSWORD:   ${{"{{"}} secrets.ANDROID_KEY_PASSWORD {{"}}"}}
          ANDROID_NDK_HOME: ${{"{{"}} env.ANDROID_SDK_ROOT {{"}}"}}/ndk/26.3.11579264

      - name: upload to Play Store (internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{"{{"}} secrets.PLAY_SERVICE_ACCOUNT_JSON {{"}}"}}
          packageName: {{bundle_id}}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
