[package]
name    = "istmo-{{project-name}}"
version = "0.1.0"
edition = "2024"
# wincode (the wire codec behind `#[message]`) needs 1.89.
rust-version = "1.89"
license = "{{crate_license}}"
authors = ["{{author_name}} <{{author_email}}>"]
description = "{{description}}"
repository = "https://github.com/{{gh_username}}/{{project-name}}"
homepage   = "https://github.com/{{gh_username}}/{{project-name}}"
readme = "README.md"
include = ["/src", "/build.rs", "/istmo.toml", "/native", "/README.md", "/LICENSE*", "/UNLICENSE"]
keywords = ["istmo", "mobile", "plugin"]
categories = ["api-bindings"]
# Cargo only forwards `cargo:KEY=VALUE` build-script metadata (the
# istmo.toml manifest + plugin contract) to dependents of a crate that
# declares `links`.
links = "istmo_{{crate_name}}"

[features]
default = []
# Enables the `codegen` module — downstream `build.rs` scripts can then
# call `istmo_{{crate_name}}::codegen::contract()` to get the `Contract`
# without going through the `DEP_*_ISTMO_CONTRACT` env handover.
codegen = ["dep:istmo-build"]

[dependencies]
# `istmo-core` + `istmo-macros` instead of the `istmo` facade: the facade
# picks the Android activity flavour, which is the app's choice.
istmo-core   = "{{istmo_version}}"
istmo-macros = "{{istmo_version}}"
wincode      = { version = "0.6", default-features = false, features = ["derive", "std"] }
istmo-build  = { version = "{{istmo_version}}", optional = true }

[build-dependencies]
istmo-build = "{{istmo_version}}"

[dev-dependencies]
pollster = "0.4"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[package.metadata.docs.rs]
all-features = true
