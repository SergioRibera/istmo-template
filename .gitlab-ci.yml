stages: [test{% if has_android and is_app %}, android{% endif %}{% if has_ios and is_app %}, ios{% endif %}{% if bundle_desktop %}, bundle{% endif %}{% if publish_crates %}, release{% endif %}]

default:
  image: rust:1.89  # MSRV
  cache:
    key: cargo
    paths: [target/, ~/.cargo/registry/]

test:
  stage: test
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --all --check
    - cargo clippy --all-targets{% if is_plugin %} --all-features{% endif %} -- -D warnings
    - cargo test --all-targets{% if is_plugin %} --all-features{% endif %}

{% if has_android and is_app %}
android:
  stage: android
  # Rust + Android SDK/NDK + Gradle, with the NDK linkers preconfigured.
  image: sergioribera/rust-android:1.98-sdk-36
  script:
    # The `io.github.sergioribera.istmo` Gradle plugin runs cargo for every ABI.
    - cd android && gradle assembleDebug --no-daemon
  artifacts:
    paths: [android/app/build/outputs/apk/debug/app-debug.apk]
{% endif %}

{% if has_ios and is_app %}
ios:
  stage: ios
  tags: [macos]
  script:
    - rustup target add aarch64-apple-ios-sim
    - brew install xcodegen
    - cargo check  # writes the xcodegen fragment and ios/.istmo/
    - cd ios && xcodegen generate
    - xcodebuild -project {{project-name | pascal_case}}App.xcodeproj -scheme {{project-name | pascal_case}}App -destination 'generic/platform=iOS Simulator' build
{% endif %}

{% if bundle_desktop %}
bundle:
  stage: bundle
  image: nixos/nix:latest
  script:
    - nix --experimental-features 'nix-command flakes' build .#bundle
  artifacts:
    paths: [result/]
{% endif %}

{% if publish_crates %}
crates:
  stage: release
  rules: [{ if: '$CI_COMMIT_TAG =~ /^v.*/' }]
  script:
    - cargo publish --token $CARGO_REGISTRY_TOKEN
{% endif %}
