# App-side istmo.toml — the single source of truth for the app identity.
# `build.rs` (`istmo_build::emit()`) reads it on every build, the
# `io.github.sergioribera.istmo` Gradle plugin and the generated Xcode
# settings apply it. A misspelled key fails the build.

[app]
id   = "{{bundle_id}}"            # applicationId + PRODUCT_BUNDLE_IDENTIFIER
name = "{{display_name}}"         # launcher label / CFBundleDisplayName
# build   = 1                     # versionCode / CFBundleVersion
# version = "0.1.0"               # default: Cargo.toml `package.version`

# Kotlin package of the generated dispatchers. Default: the Gradle
# `namespace` + `.gen`.
# android_package = "{{bundle_id}}.gen"
# ios_app_dir     = "{{project-name | pascal_case}}App"   # default: the single ios/* app dir
# auto_register   = true          # false → empty IstmoPluginRegistry

# Launcher icons. Every key is optional.
# [app.icon]
# image   = "assets/icon.png"           # iOS app icon + legacy Android mipmaps
# desktop = "assets/icon-tile.png"      # window / .exe icon (default: image)
#
# [app.icon.android]                    # adaptive icon (API 26+)
# foreground = "assets/icon-foreground.xml"
# background = "#FFFFFF"
# monochrome = "assets/icon-monochrome.xml"

[min_versions]
android = 26                      # minSdk
ios     = "14.0"                  # IPHONEOS_DEPLOYMENT_TARGET

# Per-plugin overrides. Default role is `host` (the native side implements
# the backend); `client` generates a Kotlin / Swift client for a
# Rust-hosted plugin. `auto_register = false` leaves the plugin out of
# the generated registry so the app registers it by hand.
#
# [[app.plugin]]
# id            = "istmo.data_store"
# role          = "host"
# platforms     = ["android", "ios"]
# auto_register = false

# Run a plugin in the `:remote` Android process instead of its default
# deployment. `plugin` is the id from the plugin's own istmo.toml.
#
# [[remote_override]]
# plugin     = "acme.example_plugin"
# deployment = "remote"

# Extra Gradle / Swift-package dependencies for the app itself (plugins
# carry their own).
#
# [[gradle]]
# group    = "androidx.security"
# artifact = "security-crypto"
# version  = "1.1.0-alpha06"
#
# [[swift_package]]
# url          = "https://github.com/siteline/SwiftUI-Introspect"
# product      = "SwiftUIIntrospect"
# from_version = "1.1.4"
