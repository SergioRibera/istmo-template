# xcodegen spec. Generate the .xcodeproj with:
#
#     cd ios && xcodegen generate
#
# `.xcodeproj` is not checked in — regen is deterministic.

name: {{project-name | pascal_case}}App

options:
  bundleIdPrefix: {{bundle_id}}
  deploymentTarget:
    iOS: 14.0
  createIntermediateGroups: true
  defaultConfig: Debug

packages:
  IstmoRuntime:
    url: https://github.com/SergioRibera/istmo
    from: "{{istmo_version}}.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 14.0
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LIBRARY_SEARCH_PATHS:
      - $(inherited)
      - $(PROJECT_DIR)/build/rust/$(PLATFORM_NAME)/$(CURRENT_ARCH)
    OTHER_LDFLAGS:
      - $(inherited)
      - -l{{crate_name}}

targets:
  {{project-name | pascal_case}}App:
    type: application
    platform: iOS
    sources:
      - path: {{project-name | pascal_case}}App
    info:
      path: {{project-name | pascal_case}}App/Info.plist
    dependencies:
      - package: IstmoRuntime
        product: IstmoRuntime
    preBuildScripts:
      - name: cargo build {{project-name}} (staticlib per arch)
        path: build-rust.sh
        runOnlyWhenInstalling: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: {{bundle_id}}
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
