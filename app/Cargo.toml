[package]
name    = "{{project-name}}"
version = "0.1.0"
edition = "2024"
# wincode (the istmo wire codec) needs 1.89.
rust-version = "1.89"
license = "{{crate_license}}"
authors = ["{{author_name}} <{{author_email}}>"]
description = "{{description}}"
repository = "https://github.com/{{gh_username}}/{{project-name}}"
publish = false

[lib]
# cdylib: Android `.so`; staticlib: iOS `.a`; rlib: the desktop binary.
crate-type = ["cdylib", "staticlib", "rlib"]
{% if has_desktop %}
[[bin]]
name = "{{project-name}}"
path = "src/main.rs"
{% endif %}
[dependencies]
# `game-activity`: the Android host is `IstmoGameActivity`, a
# `ComponentActivity`, so plugins whose backend needs the activity
# (sign-in, share, file picker, …) work out of the box.
istmo = { version = "{{istmo_version}}", default-features = false, features = ["game-activity"] }
log   = "0.4"
{% if plugin_google_sign_in or plugin_data_store %}
# Plugin crates. Their build scripts hand their manifest to `build.rs`,
# so `istmo::runtime!()` wires the clients and the native projects get
# the backends without further setup.
{% endif %}{% if plugin_google_sign_in %}istmo-google-sign-in = "{{istmo_version}}"
{% endif %}{% if plugin_data_store %}istmo-data-store     = "{{istmo_version}}"
{% endif %}{% if has_android %}
[target.'cfg(target_os = "android")'.dependencies]
{% if ui_framework == "egui" %}eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts", "android-game-activity"] }
winit  = { version = "0.30", default-features = false, features = ["android-game-activity"] }
{% endif %}android_logger = "0.14"
{% endif %}{% if has_ios and ui_framework == "egui" %}
[target.'cfg(any(target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos"))'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts"] }
{% endif %}{% if ui_framework == "egui" %}
# Desktop shell{% unless has_desktop %} (no desktop target: kept so `cargo check` / `clippy` /
# `test` work on the host){% endunless %}.
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos")))'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
{% endif %}
[build-dependencies]
# `istmo_build::emit()` reads `istmo.toml`, collects every plugin's
# manifest and contract, and generates the Kotlin / Swift glue.
istmo-build = "{{istmo_version}}"

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
# `#[istmo::mobile_app]` exports `#[unsafe(no_mangle)]` entry points.
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
