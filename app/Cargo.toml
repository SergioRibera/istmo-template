[package]
name    = "{{project-name}}"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "{{crate_license}}"
authors = ["{{author_name}} <{{author_email}}>"]
description = "{{description}}"
repository = "https://github.com/{{gh_username}}/{{project-name}}"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

{% if has_desktop %}
[[bin]]
name = "{{project-name}}"
path = "src/main.rs"
{% endif %}

[dependencies]
istmo   = "{{istmo_version}}"
bincode = { version = "2", features = ["derive", "std"] }
flume   = { version = "0.11", features = ["async"] }
pollster = "0.4"
log      = "0.4"

# Initial plugin clients (only the ones you ticked at generation time).
{% if plugin_google_sign_in %}istmo-google-sign-in = "0.1"
{% endif %}{% if plugin_data_store %}istmo-data-store     = "0.1"
{% endif %}
{% if has_android %}
[target.'cfg(target_os = "android")'.dependencies]
{% if ui_framework == "egui" %}eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts", "android-native-activity"] }
egui   = { version = "0.29", default-features = false }
winit  = { version = "0.30", default-features = false, features = ["android-native-activity"] }
{% endif %}android_logger = "0.14"
{% endif %}
{% if has_ios %}
[target.'cfg(any(target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos"))'.dependencies]
{% if ui_framework == "egui" %}eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts"] }
egui   = { version = "0.29", default-features = false }
winit  = { version = "0.30", default-features = false }
{% endif %}
{% endif %}
{% if has_desktop %}
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos")))'.dependencies]
{% if ui_framework == "egui" %}eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui   = { version = "0.29", default-features = false }
{% endif %}
{% endif %}

[build-dependencies]
# `istmo-build` reads `istmo.toml` + walks every `DEP_*_ISTMO_MANIFEST`
# / `DEP_*_ISTMO_CONTRACT` env var emitted by upstream plugin build
# scripts, so build.rs doesn't need per-plugin `codegen` features.
istmo-build = "{{istmo_version}}"

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
