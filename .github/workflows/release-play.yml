name: release-play

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  play:
    name: Play Store internal track
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-linux-android' }
      - uses: Swatinem/rust-cache@v2

      - name: decode release keystore
        run: |
          echo "${{"{{"}} secrets.ANDROID_KEYSTORE_B64 {{"}}"}}" | base64 -d > "$HOME/release.jks"
          echo "ANDROID_RELEASE_KEYSTORE=$HOME/release.jks" >> "$GITHUB_ENV"

      - name: assemble release bundle (.aab)
        working-directory: android
        run: ./gradlew bundleRelease
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{"{{"}} secrets.ANDROID_STORE_PASSWORD {{"}}"}}
          ANDROID_RELEASE_KEY_ALIAS:      ${{"{{"}} secrets.ANDROID_KEY_ALIAS {{"}}"}}
          ANDROID_RELEASE_KEY_PASSWORD:   ${{"{{"}} secrets.ANDROID_KEY_PASSWORD {{"}}"}}
          GITHUB_ACTOR: ${{"{{"}} github.actor {{"}}"}}
          GITHUB_TOKEN: ${{"{{"}} secrets.GITHUB_TOKEN {{"}}"}}

      - name: upload to Play Store (internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{"{{"}} secrets.PLAY_SERVICE_ACCOUNT_JSON {{"}}"}}
          packageName: {{bundle_id}}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
